version: '3.8'

services:
  # מסד הנתונים - MongoDB
  mongo:
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

  # שרת ה-Backend (FastAPI)
  backend:
    build: ./server
    restart: always
    ports:
      - 8080:8080
    environment:
      - BASE_URL=http://98.80.203.37
    depends_on:
      - mongo
    volumes:
      - ./backend/static:/app/static # שמירת תמונות ו-QR קודים מחוץ לקונטיינר

  # שרת ה-Frontend (React)
  frontend:
    build: ./client
    restart: always
    ports:
      - 80:80 # חשיפה לאינטרנט בפורט סטנדרטי
    depends_on:
      - backend

volumes:
  mongo-data: